name: ci-3dview

on:
  push:
  pull_request:

jobs:
  smoke-test:
    name: 3d-viewer-smoke-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-24.04]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python runtime tooling
        run: python -m pip install --upgrade setuptools wheel

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libEGL is required by PySide6/shiboken6 (libEGL.so.1).
          # Try several package names to cover Ubuntu variants; succeed if any installs.
          sudo apt-get install -y libgl1 || true
          EGL_PKGS=(libegl1-mesa libegl-mesa0 libgl1-mesa-glx libgl1-mesa-dri)
          for p in "${EGL_PKGS[@]}"; do
            echo "Trying to install $p..."
            if sudo apt-get install -y "$p"; then
              echo "Installed $p"
              break
            else
              echo "Package $p not available, trying next"
            fi
          done
          # Install common Qt XCB runtime packages so the xcb platform plugin can load
          QT_XCB_PKGS=(libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 libxcb-keysyms1 \
                       libxcb-image0 libxcb-icccm4 libxcb-render0 libxcb-render-util0)
          for q in "${QT_XCB_PKGS[@]}"; do
            echo "Installing $q..."
            sudo apt-get install -y "$q" || echo "Warning: failed to install $q"
          done

      - name: Install VTK/runtime deps into libs (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call "scripts\[Windows]setup_python_libs.cmd"

      - name: Install VTK/runtime deps into libs (Linux)
        if: runner.os == 'Linux'
        run: bash "scripts/[Linux]setup_python_libs.sh"

      - name: Run 3D viewer smoke test (Windows)
        if: runner.os == 'Windows'
        env:
          MOTIONGLOVE_CI: "1"
          MOTIONGLOVE_CI_SECONDS: "0.2"
          MOTIONGLOVE_CI_RENDER: "0"
        run: python motionGloveSDK_example3_3dView.py

      - name: Run 3D viewer smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          MOTIONGLOVE_CI: "1"
          MOTIONGLOVE_CI_SECONDS: "0.2"
          MOTIONGLOVE_CI_RENDER: "0"
        run: python motionGloveSDK_example3_3dView.py
